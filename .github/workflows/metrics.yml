name: Metrics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - profile/**
      - images/background.jpg
      - .github/workflows/metrics.yml

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Generate Terminal Header
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-terminal.svg
          output_action: none
          token: ${{ secrets.METRICS_TOKEN }}
          user: anka-afk
          template: terminal
          base: header, repositories
          plugin_languages: 'no'
          plugin_projects: 'no'
          retries: 2
          retries_delay: 10

      - name: Generate Achievements
        uses: dkhokhlov/metrics@master
        with:
          filename: github-metrics-achievements.svg
          output_action: none
          token: ${{ secrets.METRICS_TOKEN }}
          user: anka-afk
          template: classic
          base: ''
          config_timezone: Asia/Shanghai
          plugin_achievements: 'yes'
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          retries: 2
          retries_delay: 10

      - name: Generate Coding Habits and Stargazers
        uses: dkhokhlov/metrics@master
        with:
          filename: github-metrics-plugins.svg
          output_action: none
          token: ${{ secrets.METRICS_TOKEN }}
          user: anka-afk
          template: classic
          base: ''
          config_timezone: Asia/Shanghai
          plugin_habits: 'yes'
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: 'yes'
          plugin_habits_charts: 'no'
          plugin_stargazers: 'yes'
          plugin_stargazers_charts: 'yes'
          retries: 2
          retries_delay: 10

      - name: Render profile cards
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          for card in terminal achievements plugins; do
            sudo install -m 0644 "/metrics_renders/github-metrics-$card.svg" "github-metrics-$card.svg"
          done
          python3 profile/render.py

      - name: Publish profile cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- github-metrics-terminal.svg github-metrics-achievements.svg github-metrics-plugins.svg images/profile
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh profile cards [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1
