name: Metrics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - profile/**
      - images/background.jpg
      - .github/workflows/metrics.yml

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test profile data fallbacks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s profile -p 'test_*.py'

      - name: Generate Terminal Header
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-terminal.svg
          output_action: none
          token: ${{ secrets.METRICS_TOKEN }}
          user: anka-afk
          template: terminal
          base: header, repositories
          plugin_languages: 'no'
          plugin_projects: 'no'
          retries: 2
          retries_delay: 10

      - name: Generate Achievements
        uses: dkhokhlov/metrics@master
        with:
          filename: github-metrics-achievements.svg
          output_action: none
          token: ${{ secrets.METRICS_TOKEN }}
          user: anka-afk
          template: classic
          base: ''
          config_timezone: Asia/Shanghai
          plugin_achievements: 'yes'
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          retries: 2
          retries_delay: 10

      - name: Generate Coding Habits and Stargazers
        uses: dkhokhlov/metrics@master
        with:
          filename: github-metrics-plugins.svg
          output_action: none
          token: ${{ secrets.METRICS_TOKEN }}
          user: anka-afk
          template: classic
          base: ''
          config_timezone: Asia/Shanghai
          plugin_habits: 'yes'
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: 'yes'
          plugin_habits_charts: 'no'
          plugin_stargazers: 'yes'
          plugin_stargazers_charts: 'yes'
          retries: 2
          retries_delay: 10

      - name: Render profile cards
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          for card in terminal achievements plugins; do
            sudo install -m 0644 "/metrics_renders/github-metrics-$card.svg" "github-metrics-$card.svg"
          done
          python3 profile/render.py
          python3 profile/update_writing.py

      - name: Publish profile cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md github-metrics-terminal.svg github-metrics-achievements.svg github-metrics-plugins.svg images/profile profile/cache
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh profile cards [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1

      - name: Generate contribution snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#49296f&color_dots=#efe8f7,#ded0f0,#bf9fdf,#966fc5,#63418e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f0bddb&color_dots=#2d233b,#49345e,#6a4b88,#946cc0,#c5a2ea

      - name: Publish contribution snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
