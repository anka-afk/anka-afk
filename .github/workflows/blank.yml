name: generate animation

on:
  # 每 2 小时自动运行一次
  schedule:
    - cron: "0 */2 * * *" 
  
  # 支持手动运行
  workflow_dispatch:
  
  # 配色修改后立即更新两种主题的动画
  push:
    branches: [main]
    paths:
      - .github/workflows/blank.yml

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
  
    steps:
      # 生成贪吃蛇动画 SVG
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#49296f&color_dots=#efe8f7,#ded0f0,#bf9fdf,#966fc5,#63418e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f0bddb&color_dots=#2d233b,#49345e,#6a4b88,#946cc0,#c5a2ea
  
      # 将生成的 SVG 推送到 output 分支
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
